<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="undertow">
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#0b3954"/>
    </linearGradient>
  </defs>

  <!-- surface -->
  <path d="M40 44 Q 115 26 190 44 T 340 44 T 490 44 T 640 44" transform="translate(-20,0)"
        fill="none" stroke="#4dabf7" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <!-- currents below, pulling the other way -->
  <path d="M40 62 Q 115 78 190 62 T 340 62 T 490 62 T 640 62" transform="translate(-20,0)"
        fill="none" stroke="#339af0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 78 Q 115 92 190 78 T 340 78 T 490 78 T 640 78" transform="translate(-20,0)"
        fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M40 92 Q 115 104 190 92 T 340 92 T 490 92 T 640 92" transform="translate(-20,0)"
        fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

  <text x="320" y="148" text-anchor="middle"
        font-family="Menlo, 'DejaVu Sans Mono', 'Courier New', monospace"
        font-size="52" font-weight="bold" letter-spacing="4" fill="url(#depth)">undertow</text>
  <text x="320" y="178" text-anchor="middle"
        font-family="Menlo, 'DejaVu Sans Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="1.5" fill="#748ffc">the current under the surface</text>
</svg>
