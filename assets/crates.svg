<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Crate layering">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .band { fill: rgba(51,154,240,0.05); stroke: #339af0; stroke-width: 1.2; }
    .bandlabel { fill: #339af0; font-size: 12px; font-weight: bold; }
    .box { fill: rgba(100,116,139,0.10); stroke: #64748b; stroke-width: 1.4; }
    .name { fill: #339af0; font-family: Menlo, 'Courier New', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .role { fill: #64748b; font-size: 10.5px; text-anchor: middle; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- frontends -->
  <rect class="band" x="20" y="16" width="720" height="86" rx="10"/>
  <text class="bandlabel" x="34" y="36">frontends</text>
  <rect class="box" x="60" y="44" width="180" height="46" rx="7"/>
  <text class="name" x="150" y="64">undertow-cli</text>
  <text class="role" x="150" y="80">convert, run, chat, serve, bench</text>
  <rect class="box" x="290" y="44" width="180" height="46" rx="7"/>
  <text class="name" x="380" y="64">undertow-server</text>
  <text class="role" x="380" y="80">OpenAI-compatible HTTP</text>
  <rect class="box" x="520" y="44" width="180" height="46" rx="7"/>
  <text class="name" x="610" y="64">undertow-bench</text>
  <text class="role" x="610" y="80">oracle models, correctness</text>

  <!-- adapters -->
  <rect class="band" x="20" y="122" width="720" height="140" rx="10"/>
  <text class="bandlabel" x="34" y="142">adapters/ (one crate per family)</text>
  <rect class="box" x="60" y="152" width="200" height="46" rx="7"/>
  <text class="name" x="160" y="172">undertow-deepseek-moe</text>
  <text class="role" x="160" y="188">MLA, noaux_tc router, MTP</text>
  <rect class="box" x="290" y="152" width="180" height="46" rx="7"/>
  <text class="name" x="380" y="172">undertow-mixtral-moe</text>
  <text class="role" x="380" y="188">softmax router, windowed GQA</text>
  <rect class="box" x="500" y="152" width="180" height="46" rx="7"/>
  <text class="name" x="590" y="172">undertow-qwen-moe</text>
  <text class="role" x="590" y="188">q/k norms, sparse steps</text>
  <rect class="box" x="360" y="208" width="220" height="42" rx="7"/>
  <text class="name" x="470" y="227">undertow-moe-common</text>
  <text class="role" x="470" y="242">shared GQA forward, loader, sessions</text>
  <path class="edge" d="M390 198 C 400 202, 420 206, 440 210"/>
  <path class="edge" d="M580 198 C 570 202, 550 206, 520 210"/>

  <!-- services -->
  <rect class="band" x="20" y="282" width="720" height="86" rx="10"/>
  <text class="bandlabel" x="34" y="302">services</text>
  <rect class="box" x="120" y="310" width="220" height="46" rx="7"/>
  <text class="name" x="230" y="330">undertow-convert</text>
  <text class="role" x="230" y="346">streaming resumable quantizer</text>
  <rect class="box" x="420" y="310" width="220" height="46" rx="7"/>
  <text class="name" x="530" y="330">undertow-tokenizer</text>
  <text class="role" x="530" y="346">BPE, chat templates, streaming</text>

  <!-- runtime -->
  <rect class="band" x="20" y="388" width="720" height="86" rx="10"/>
  <text class="bandlabel" x="34" y="408">runtime</text>
  <rect class="box" x="120" y="416" width="220" height="46" rx="7"/>
  <text class="name" x="230" y="436">undertow-core</text>
  <text class="role" x="230" y="452">traits, caches, sampling, profiles</text>
  <rect class="box" x="420" y="416" width="220" height="46" rx="7"/>
  <text class="name" x="530" y="436">undertow-io</text>
  <text class="role" x="530" y="452">pread safetensors, disk store</text>

  <!-- kernels -->
  <rect class="band" x="20" y="494" width="720" height="52" rx="10"/>
  <text class="bandlabel" x="34" y="514">kernels</text>
  <rect class="box" x="270" y="502" width="220" height="38" rx="7"/>
  <text class="name" x="380" y="519">undertow-quant</text>
  <text class="role" x="380" y="533">scalar reference + NEON, int8/int4</text>

  <!-- band-to-band arrows -->
  <path class="edge" d="M380 102 L380 116"/>
  <path class="edge" d="M380 262 L380 276"/>
  <path class="edge" d="M380 368 L380 382"/>
  <path class="edge" d="M380 474 L380 488"/>

  <text class="role" x="740" y="556" style="text-anchor:end">dependencies point downward; a crate may use anything in the bands beneath it</text>
</svg>
