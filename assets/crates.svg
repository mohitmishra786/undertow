<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Crate dependency graph">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill: rgba(100,116,139,0.08); stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .name { fill: #339af0; font-family: Menlo, 'Courier New', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .role { fill: #64748b; font-size: 11px; text-anchor: middle; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dev  { stroke-dasharray: 5 4; }
  </style>

  <!-- top row -->
  <rect class="box" x="100" y="18" width="170" height="52" rx="8"/>
  <text class="name" x="185" y="40">engine-cli</text>
  <text class="role" x="185" y="58">run, bench, convert, chat</text>

  <rect class="box" x="410" y="18" width="170" height="52" rx="8"/>
  <text class="name" x="495" y="40">engine-bench</text>
  <text class="role" x="495" y="58">oracle models, correctness</text>

  <!-- middle row -->
  <text class="role" x="340" y="126">engine-adapters/</text>
  <rect class="box" x="245" y="132" width="190" height="52" rx="8"/>
  <text class="name" x="340" y="154">deepseek-moe</text>
  <text class="role" x="340" y="172">router, MLA, model, loader</text>

  <!-- bottom row -->
  <rect class="box" x="35" y="252" width="170" height="52" rx="8"/>
  <text class="name" x="120" y="274">engine-core</text>
  <text class="role" x="120" y="292">traits, tensor, errors</text>

  <rect class="box" x="255" y="252" width="170" height="52" rx="8"/>
  <text class="name" x="340" y="274">engine-quant</text>
  <text class="role" x="340" y="292">scalar kernels, quant later</text>

  <rect class="box" x="475" y="252" width="170" height="52" rx="8"/>
  <text class="name" x="560" y="274">engine-io</text>
  <text class="role" x="560" y="292">safetensors via pread</text>

  <!-- edges: arrow points at the dependency -->
  <path class="edge" d="M270 44 L404 44"/>
  <path class="edge" d="M222 70 C 250 100, 270 115, 296 128"/>
  <path class="edge dev" d="M458 70 C 430 100, 410 115, 384 128"/>
  <path class="edge" d="M513 70 C 530 130, 548 190, 557 246"/>
  <path class="edge" d="M282 184 C 220 210, 170 230, 133 246"/>
  <path class="edge" d="M340 184 L340 246"/>
  <path class="edge" d="M398 184 C 460 210, 510 230, 547 246"/>
  <path class="edge" d="M540 304 C 520 336, 160 336, 128 308"/>

  <text class="role" x="20" y="360" style="text-anchor:start">arrows point at the crate being depended on; dashed = dev dependency; transitive edges omitted</text>
</svg>
