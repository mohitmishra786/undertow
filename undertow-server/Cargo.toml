[package]
name = "undertow-server"
description = "OpenAI-compatible HTTP server over any undertow model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
undertow-core.workspace = true
undertow-tokenizer.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
undertow-deepseek-moe.workspace = true
undertow-tokenizer.workspace = true
reqwest = { version = "0.13", features = ["json", "blocking"] }
