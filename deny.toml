# cargo-deny policy: advisories, licenses, bans, sources.
# Run locally with `cargo deny check`; CI runs it on every manifest change
# and daily (new RUSTSEC advisories should fail fast).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is archived (unmaintained, not a vulnerability). Pulled in
    # transitively by tokenizers -> macro_rules_attribute; nothing we can
    # swap locally. Revisit when tokenizers drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses only; anything new fails loudly and gets reviewed
# here rather than slipping in through a transitive dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members reference each other by path without versions; that is
# not the supply-chain wildcard this lint exists for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
