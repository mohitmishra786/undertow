name: Release (draft)

# Manual only, by design: releasing is a decision, not a side effect.
# Dispatch with a tag like v0.2.0; the workflow tags the chosen ref,
# builds binaries for every supported platform, attaches checksums, an
# SBOM and build provenance, and leaves a DRAFT release for human review.
# Nothing is published until someone presses the button on the release
# page.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag shape
        run: |
          echo "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "tag must look like v0.2.0"; exit 1; }
      - name: Create draft release on this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "undertow ${{ inputs.tag }}" \
            --generate-notes

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release binary
        run: cargo build --release --locked -p undertow-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          staging="undertow-${{ inputs.tag }}-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/undertow" "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="undertow-${{ inputs.tag }}-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/undertow.exe" "$staging/"
          cp LICENSE README.md "$staging/"
          7z a "$staging.zip" "$staging" > /dev/null
          sha256sum "$staging.zip" > "$staging.zip.sha256"
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "$ASSET" "$ASSET.sha256"

  sbom:
    needs: create-draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --all
          # One document covering the workspace: merge is overkill, ship
          # the binary crate's SBOM which includes the full dependency
          # closure.
          cp undertow-cli/undertow-cli.cdx.json "undertow-${{ inputs.tag }}.cdx.json"
      - name: Upload SBOM to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "undertow-${{ inputs.tag }}.cdx.json"
