name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR so rapid pushes don't burn minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, docs, typos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Docs build clean
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1

  test:
    name: Clippy + test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux: the scalar kernel path, most common server target.
          - name: linux-x64
            os: ubuntu-latest
          # aarch64 Linux: exercises the NEON kernels off-Apple.
          - name: linux-arm64
            os: ubuntu-24.04-arm
          # Apple Silicon: primary dev target, NEON + unified memory.
          - name: macos-arm64
            os: macos-latest
          # Windows: the pread fallback (seek_read) and path handling.
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Clippy runs per-OS on purpose: cfg-gated code (NEON, pread
      # fallbacks, test helpers) is invisible to a single-platform lint.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check on the declared minimum
        run: cargo check --workspace --all-targets --locked

  unused-deps:
    name: Unused dependencies (machete)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  miri:
    name: Miri (kernel soundness)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # nightly
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The quant crate is where packed-byte indexing lives; Miri checks
      # the scalar paths for UB (NEON intrinsics are cfg'd off on x86).
      - name: Miri test undertow-quant
        run: cargo +nightly miri test -p undertow-quant
        env:
          MIRIFLAGS: -Zmiri-backtrace=full

  coverage:
    name: Coverage
    # Merge/dispatch only: the lcov artifact is the post-merge record;
    # PRs don't need to pay for it on every push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (node24)
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
