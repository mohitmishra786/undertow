[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "undertow-core",
    "undertow-quant",
    "undertow-io",
    "undertow-convert",
    "undertow-tokenizer",
    "undertow-server",
    "adapters/undertow-deepseek-moe",
    "adapters/undertow-moe-common",
    "adapters/undertow-mixtral-moe",
    "adapters/undertow-qwen-moe",
    "undertow-bench",
    "undertow-cli",
]

[workspace.package]
version = "0.1.0"
# Path-only internal deps; publishing needs explicit versioning first.
publish = false
edition = "2021"
# usize::is_multiple_of stabilized in 1.87; CI checks this floor.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/mohitmishra786/undertow"
authors = ["Mohit Mishra <immadmohit@gmail.com>"]

[workspace.dependencies]
undertow-core = { path = "undertow-core" }
undertow-quant = { path = "undertow-quant" }
undertow-io = { path = "undertow-io" }
undertow-deepseek-moe = { path = "adapters/undertow-deepseek-moe" }
undertow-moe-common = { path = "adapters/undertow-moe-common" }
undertow-mixtral-moe = { path = "adapters/undertow-mixtral-moe" }
undertow-qwen-moe = { path = "adapters/undertow-qwen-moe" }
undertow-convert = { path = "undertow-convert" }
undertow-tokenizer = { path = "undertow-tokenizer" }
undertow-server = { path = "undertow-server" }
undertow-bench = { path = "undertow-bench" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
half = "2"
rayon = "1"

[profile.release]
debug = true

# Oracle tests do full float forward passes; unoptimized debug builds make
# them needlessly slow.
[profile.test]
opt-level = 2
